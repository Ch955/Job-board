# Job Radar configuration. Everything tunable lives here: no code changes needed
# to add companies, keywords or change scoring weights.

profile:
  name: Chakri
  role: Azure Data Engineer
  years_experience: 3
  apply_email: chakri.evn@gmail.com
  notice: Immediate joiner

# ---------------------------------------------------------------------------
# Pipeline limits
# ---------------------------------------------------------------------------
pipeline:
  max_age_days: 30          # drop jobs posted (or first seen) more than N days ago
  min_score: 40             # drop jobs scoring below this
  alert_score: 70           # Telegram alert threshold (phase 2)
  snippet_chars: 300
  http_timeout_s: 20
  max_workers: 8            # parallel requests to company boards
  output: docs/jobs.json
  # Jobs you have applied to / are interviewing for are kept past max_age_days
  keep_statuses: [applied, interview, offer]

# ---------------------------------------------------------------------------
# Relevance gate: a title must match at least one title rule to be considered
# at all, and must not match any exclude pattern. Patterns are Python regexes,
# matched case-insensitively.
# ---------------------------------------------------------------------------
title:
  rules:                     # best matching rule gives the title points (max 25)
    - { pattern: 'azure\s+data\s+engineer',            points: 25 }
    - { pattern: '\bdata\s+engineer',                  points: 25 }
    - { pattern: '\bdata\s+engineering\b',             points: 22 }
    - { pattern: 'big\s*data',                         points: 22 }
    - { pattern: 'databricks',                         points: 22 }
    - { pattern: '(cloud|platform)\s+data',            points: 22 }
    - { pattern: 'data\s+(platform|pipeline|integration|warehouse|lake)', points: 20 }
    - { pattern: '\b(etl|elt)\b',                      points: 18 }
    - { pattern: 'analytics\s+engineer',               points: 18 }
    - { pattern: '(spark|pyspark|snowflake|bigquery)\s+(developer|engineer)', points: 20 }
    - { pattern: '(software|backend)\s+engineer.*\bdata\b', points: 14 }
    - { pattern: '\bdata\b.*\b(engineer|developer)\b', points: 15 }
  exclude:                   # title matching any of these is dropped
    - '\bintern(ship)?\b'
    - '\b(director|vp|vice president|head of)\b'
    - '\bmanager\b'
    - '\b(sales|recruit(er|ing)|marketing|account executive)\b'
    - '\bdata\s+(scientist|analyst|entry)\b'
  penalties:                 # matched patterns subtract points
    - { pattern: '\b(principal|staff|distinguished)\b', points: -15 }
    - { pattern: '\b(lead|architect)\b',                points: -8 }

# ---------------------------------------------------------------------------
# Skills: matched in title + description. Matched names are shown on the card.
# Total skill points are capped at `max_points`.
# ---------------------------------------------------------------------------
skills:
  max_points: 35
  keywords:
    - { name: ADF,             weight: 6, patterns: ['azure data factory', '\badf\b'] }
    - { name: Databricks,      weight: 6, patterns: ['databricks'] }
    - { name: PySpark,         weight: 6, patterns: ['pyspark'] }
    - { name: Spark,           weight: 4, patterns: ['\bspark\b', 'spark sql'] }
    - { name: ADLS Gen2,       weight: 5, patterns: ['\badls\b', 'adls gen ?2', 'azure data lake'] }
    - { name: Azure,           weight: 5, patterns: ['\bazure\b'] }
    - { name: Snowflake,       weight: 5, patterns: ['snowflake'] }
    - { name: BigQuery,        weight: 4, patterns: ['bigquery', 'big query'] }
    - { name: Azure DevOps,    weight: 3, patterns: ['azure devops', '\bado\b pipelines'] }
    - { name: Synapse,         weight: 3, patterns: ['synapse'] }
    - { name: Delta Lake,      weight: 3, patterns: ['delta lake', 'delta tables?', 'lakehouse'] }
    - { name: SQL,             weight: 3, patterns: ['\bsql\b', 't-sql', 'tsql'] }
    - { name: Python,          weight: 3, patterns: ['\bpython\b'] }
    - { name: Airflow,         weight: 2, patterns: ['airflow'] }
    - { name: dbt,             weight: 2, patterns: ['\bdbt\b'] }
    - { name: Kafka,           weight: 2, patterns: ['kafka', 'event ?hubs?'] }
    - { name: ETL/ELT,         weight: 2, patterns: ['\betl\b', '\belt\b'] }
    - { name: Data Modeling,   weight: 2, patterns: ['data model(l)?ing', 'dimensional model', 'star schema'] }
    - { name: CI/CD,           weight: 2, patterns: ['ci ?/ ?cd'] }
    - { name: Unity Catalog,   weight: 2, patterns: ['unity catalog'] }
    - { name: GCP,             weight: 1, patterns: ['\bgcp\b', 'google cloud'] }
    - { name: Terraform,       weight: 1, patterns: ['terraform'] }

# ---------------------------------------------------------------------------
# Location: India only. Any Indian city is fine; remote counts only when the
# posting says it's open to India. Everything abroad is dropped.
# ---------------------------------------------------------------------------
location:
  points_preferred: 20       # cities below (also used as the card label)
  points_india_other: 20     # anywhere else in India: you're open to all of India
  points_remote: 20          # remote, open to India
  preferred:
    Hyderabad: ['hyderabad', 'secunderabad', 'hitec city', 'gachibowli']
    Bangalore: ['bangalore', 'bengaluru']
    Pune:      ['pune']
    Mumbai:    ['mumbai', 'navi mumbai', 'thane']
  india_terms: ['india', ',\s*in$', '\bind$',
                'chennai', 'gurgaon', 'gurugram', 'noida', 'delhi', '\bncr\b', 'faridabad', 'ghaziabad',
                'kolkata', 'ahmedabad', 'gandhinagar', 'vadodara', 'surat', 'kochi', 'cochin', 'trivandrum',
                'thiruvananthapuram', 'coimbatore', 'madurai', 'jaipur', 'chandigarh', 'mohali', 'indore',
                'bhopal', 'bhubaneswar', 'nagpur', 'nashik', 'lucknow', 'mysore', 'mysuru', 'mangalore',
                'mangaluru', 'visakhapatnam', 'vizag', 'vijayawada', 'warangal', 'goa', 'kanpur', 'patna',
                'karnataka', 'maharashtra', 'telangana', 'tamil nadu', 'kerala', 'haryana', 'gujarat',
                'uttar pradesh', 'west bengal', 'andhra pradesh', 'odisha', 'rajasthan', 'punjab']
  # These win over a matching Indian city name (e.g. "Hyderabad, Pakistan")
  not_india_terms: ['pakistan', 'sindh', 'bangladesh', 'sri lanka', 'nepal']
  remote_terms: ['remote', 'work from home', '\bwfh\b', 'anywhere', 'distributed']
  # Drop everything that isn't in India or remote-open-to-India.
  drop_ineligible: true

experience:
  points: 10
  my_years: 3
  # Parsed "X+ years" / "X-Y years" from the description. Required minimum years:
  full_if_min_at_most: 4     # min <= 4 -> full points
  half_if_min_at_most: 6     # min <= 6 -> half points, above that -> 0
  unknown_points: 5          # no years mentioned

recency:                     # days since posted -> points (first match wins)
  - { max_days: 1,  points: 10 }
  - { max_days: 3,  points: 8 }
  - { max_days: 7,  points: 6 }
  - { max_days: 14, points: 3 }
  - { max_days: 30, points: 1 }

# ---------------------------------------------------------------------------
# Sources. Each runs in isolation: one failing never stops the others.
# Set enabled: false to switch one off. min_interval_hours throttles sources
# that ask for gentle use (state is kept in docs/jobs.json).
# ---------------------------------------------------------------------------
sources:
  greenhouse:      { enabled: true }
  lever:           { enabled: true }
  ashby:           { enabled: true }
  smartrecruiters: { enabled: true, query: data, max_details_per_company: 15 }
  jobspy:
    # LinkedIn, Naukri and Indeed India via the open-source JobSpy library
    # (github.com/speedyapply/JobSpy). Free, no login: it reads the same public
    # search pages you see logged out. Sites may rate-limit; failures only skip that site.
    enabled: true
    sites: [naukri, linkedin, indeed]
    queries: ['azure data engineer', 'databricks data engineer', 'data engineer pyspark']
    location: India
    country_indeed: india
    results_wanted: 30       # per site per query
    hours_old: 72            # only recent postings; runs every 3h so this has slack
    fetch_description: true  # needed for skill scoring; slower (one extra request per job)
  adzuna:
    enabled: true           # needs ADZUNA_APP_ID + ADZUNA_APP_KEY, skipped otherwise
    country: in
    queries: ['azure data engineer', 'data engineer databricks']
    where: ['Hyderabad', 'Bangalore', 'Pune', 'Mumbai']
    results_per_page: 50
    # 2 queries x 4 cities = 8 calls/run, 64/day: well under the free quota
  jooble:
    enabled: true           # needs JOOBLE_API_KEY, skipped otherwise
    queries: ['azure data engineer', 'databricks data engineer']
    locations: ['Hyderabad', 'Bangalore', 'Pune', 'Mumbai', 'India']
    min_interval_hours: 6   # 10 calls/run x 4 runs/day, keeps the free key happy
  remotive:
    enabled: true
    category: data
    search: data engineer
    min_interval_hours: 6   # Remotive asks for at most ~4 calls/day
  arbeitnow:
    enabled: false          # mostly Germany-based jobs; nothing for India-only search
    pages: 3
    remote_only: true

