# Job Radar configuration. Everything tunable lives here: no code changes needed
# to add companies, keywords or change scoring weights.

profile:
  name: Chakri
  role: Azure Data Engineer
  years_experience: 3
  apply_email: chakri.evn@gmail.com
  notice: Immediate joiner
  full_name: Chakravardhana Rao Edupulapati
  linkedin: https://www.linkedin.com/in/chakravardhanarao-edupulapati-6765b11a3
  # Your phone number is deliberately NOT here (this repo is public). To sign
  # emails with it, add a GitHub Secret EMAIL_SIGNATURE, e.g. "Phone: +91-..."

# ---------------------------------------------------------------------------
# Recruiter outreach. Email drafts are created in your Gmail (never sent).
# LinkedIn notes are copied in the app; you send them yourself.
# Placeholders: {title} {company} {location} {skills} {years} {notice} {name}
#               {full_name} {role} {email} {linkedin} {url}
# ---------------------------------------------------------------------------
outreach:
  drafts_enabled: true
  min_score: 70              # only draft for jobs at or above this score
  max_drafts_per_run: 10
  cooldown_days: 30          # never draft the same address twice within this
  # {skills} only ever names skills from your resume, even if the job lists others
  my_skills: [ADF, Databricks, PySpark, ADLS Gen2, SCD, Incremental Load, Metadata-driven, ETL/ELT,
              SHIR / Hybrid, Azure DevOps, Data Warehousing, Data Modeling, Data Migration, Power BI,
              Azure Security, Spark, SQL, Python, Git]
  email:
    subject: "Immediate Joiner - {title} ({years} yrs) - {full_name}"
    body: |
      Hi,

      I came across the {title} opening at {company} ({location}) and would like to be considered.

      I'm an Azure Data Engineer with {years}+ years at Capgemini, building metadata-driven ADF pipelines into ADLS Gen2, PySpark and SCD Type 1/2 in Azure Databricks, incremental loads, and SHIR-based hybrid integration, with Azure DevOps CI/CD. The role's focus on {skills} matches my day-to-day work closely.

      I'm an {notice_lower} and my resume is attached. I'd be glad to talk whenever suits you.

      Thanks,
      {full_name}
      {email}
      {linkedin}
  # LinkedIn caps connection notes at 200 characters on free accounts
  linkedin_note: "Hi! I'm an Azure Data Engineer ({years}+ yrs: ADF, Databricks, PySpark), {notice_lower}. I've applied for {title} at {company} and would love to connect. Thanks, {name}"

# ---------------------------------------------------------------------------
# Pipeline limits
# ---------------------------------------------------------------------------
pipeline:
  max_age_days: 30          # drop jobs posted (or first seen) more than N days ago
  min_score: 40             # drop jobs scoring below this
  alert_score: 70           # phone notification for every new job at or above this
  max_alerts_per_run: 5     # beyond this, one "+N more" notification instead
  snippet_chars: 300
  http_timeout_s: 20
  max_workers: 8            # parallel requests to company boards
  output: docs/jobs.json
  # Jobs you have applied to / are interviewing for are kept past max_age_days
  keep_statuses: [applied, interview, offer]

# ---------------------------------------------------------------------------
# Relevance gate: a title must match at least one title rule to be considered
# at all, and must not match any exclude pattern. Patterns are Python regexes,
# matched case-insensitively.
# ---------------------------------------------------------------------------
title:
  rules:                     # best matching rule gives the title points (max 25)
    - { pattern: 'azure\s+data\s+engineer',            points: 25 }
    - { pattern: '\bdata\s+engineer',                  points: 25 }
    - { pattern: '\bdata\s+engineering\b',             points: 22 }
    - { pattern: 'big\s*data',                         points: 22 }
    - { pattern: 'databricks',                         points: 22 }
    - { pattern: '(cloud|platform)\s+data',            points: 22 }
    - { pattern: 'data\s+(platform|pipeline|integration|warehouse|lake)', points: 20 }
    - { pattern: '\b(etl|elt)\b',                      points: 18 }
    - { pattern: 'analytics\s+engineer',               points: 18 }
    - { pattern: '(spark|pyspark|snowflake|bigquery)\s+(developer|engineer)', points: 20 }
    - { pattern: '(software|backend)\s+engineer.*\bdata\b', points: 14 }
    - { pattern: '\bdata\b.*\b(engineer|developer)\b', points: 15 }
  exclude:                   # title matching any of these is dropped
    - '\bintern(ship)?\b'
    - '\b(director|vp|vice president|head of)\b'
    - '\bmanager\b'
    - '\b(sales|recruit(er|ing)|marketing|account executive)\b'
    - '\bdata\s+(scientist|analyst|entry)\b'
  penalties:                 # matched patterns subtract points
    - { pattern: '\b(principal|staff|distinguished)\b', points: -15 }
    - { pattern: '\b(lead|architect)\b',                points: -8 }

# ---------------------------------------------------------------------------
# Skills: matched in title + description. Matched names are shown on the card.
# Total skill points are capped at `max_points`.
# ---------------------------------------------------------------------------
skills:
  # Weights follow your resume: what you do every day at Capgemini scores
  # highest, things you've used scores medium, and tools not on your resume
  # (Snowflake, BigQuery, Airflow...) get a token point.
  max_points: 35
  keywords:
    # Core: your daily stack
    - { name: ADF,              weight: 6, patterns: ['azure data factory', '\badf\b'] }
    - { name: Databricks,       weight: 6, patterns: ['databricks'] }
    - { name: PySpark,          weight: 5, patterns: ['pyspark'] }
    - { name: ADLS Gen2,        weight: 5, patterns: ['\badls\b', 'adls gen ?2', 'azure data lake', 'blob storage'] }
    - { name: Azure,            weight: 4, patterns: ['\bazure\b'] }
    - { name: SQL,              weight: 4, patterns: ['\bsql\b', 't-sql', 'tsql', 'sql server', 'azure sql'] }
    # Strong: named on your resume
    - { name: SCD,              weight: 3, patterns: ['\bscd\b', 'slowly changing dimension'] }
    - { name: Incremental Load, weight: 3, patterns: ['incremental (load|data|ingestion|refresh)', 'change data capture', '\bcdc\b', 'delta load', 'watermark'] }
    - { name: Metadata-driven,  weight: 3, patterns: ['metadata[- ]driven', 'config(uration)?[- ]driven', 'parameteri[sz]ed pipelines?'] }
    - { name: ETL/ELT,          weight: 3, patterns: ['\betl\b', '\belt\b'] }
    - { name: Python,           weight: 3, patterns: ['\bpython\b'] }
    - { name: Spark,            weight: 3, patterns: ['\bspark\b', 'spark sql'] }
    - { name: Azure DevOps,     weight: 3, patterns: ['azure devops', '\bado\b', 'ci ?/ ?cd'] }
    - { name: Data Warehousing, weight: 3, patterns: ['data ?warehous', '\bdwh?\b', '\bedw\b'] }
    - { name: SHIR / Hybrid,    weight: 3, patterns: ['self[- ]hosted integration runtime', '\bshir\b', 'integration runtime', 'on[- ]prem(ise)?s?'] }
    - { name: Data Modeling,    weight: 2, patterns: ['data model(l)?ing', 'dimensional model', 'star schema', 'dimension tables?'] }
    - { name: Data Migration,   weight: 2, patterns: ['(data|cloud) migration', 'migrat(e|ing) .{0,30}(azure|cloud)'] }
    - { name: Power BI,         weight: 2, patterns: ['power ?bi'] }
    - { name: Azure Security,   weight: 2, patterns: ['key ?vault', 'entra', 'azure (ad|active directory)', '\brbac\b'] }
    - { name: Data Governance,  weight: 1, patterns: ['data governance', 'unity catalog', 'purview'] }
    - { name: Git,              weight: 1, patterns: ['\bgit\b', 'github'] }
    # Azure-adjacent, easy to pick up from your stack
    - { name: Synapse,          weight: 2, patterns: ['synapse'] }
    - { name: Delta Lake,       weight: 2, patterns: ['delta lake', 'delta tables?', 'lakehouse'] }
    - { name: Fabric,           weight: 2, patterns: ['microsoft fabric', '\bfabric\b'] }
    # Not on your resume: a token point so the match still shows on the card
    - { name: Snowflake,        weight: 1, patterns: ['snowflake'] }
    - { name: BigQuery,         weight: 1, patterns: ['bigquery', 'big query'] }
    - { name: Airflow,          weight: 1, patterns: ['airflow'] }
    - { name: dbt,              weight: 1, patterns: ['\bdbt\b'] }
    - { name: Kafka,            weight: 1, patterns: ['kafka', 'event ?hubs?'] }
  # A job built on another cloud's data stack, never mentioning Azure, is a
  # weak fit for an Azure profile even if the title matches.
  stack_mismatch:
    points: -12
    patterns: ['aws glue', 'redshift', '\bemr\b', 'kinesis', 'athena', 'dataproc', 'dataflow', 'cloud composer']
    unless: ['\bazure\b', 'databricks', '\badf\b']

# ---------------------------------------------------------------------------
# Location: India only. Any Indian city is fine; remote counts only when the
# posting says it's open to India. Everything abroad is dropped.
# ---------------------------------------------------------------------------
location:
  points_preferred: 20       # cities below (also used as the card label)
  points_india_other: 20     # anywhere else in India: you're open to all of India
  points_remote: 20          # remote, open to India
  preferred:
    Hyderabad: ['hyderabad', 'secunderabad', 'hitec city', 'gachibowli']
    Bangalore: ['bangalore', 'bengaluru']
    Pune:      ['pune']
    Mumbai:    ['mumbai', 'navi mumbai', 'thane']
  india_terms: ['india', ',\s*in$', '\bind$',
                'chennai', 'gurgaon', 'gurugram', 'noida', 'delhi', '\bncr\b', 'faridabad', 'ghaziabad',
                'kolkata', 'ahmedabad', 'gandhinagar', 'vadodara', 'surat', 'kochi', 'cochin', 'trivandrum',
                'thiruvananthapuram', 'coimbatore', 'madurai', 'jaipur', 'chandigarh', 'mohali', 'indore',
                'bhopal', 'bhubaneswar', 'nagpur', 'nashik', 'lucknow', 'mysore', 'mysuru', 'mangalore',
                'mangaluru', 'visakhapatnam', 'vizag', 'vijayawada', 'warangal', 'goa', 'kanpur', 'patna',
                'karnataka', 'maharashtra', 'telangana', 'tamil nadu', 'kerala', 'haryana', 'gujarat',
                'uttar pradesh', 'west bengal', 'andhra pradesh', 'odisha', 'rajasthan', 'punjab']
  # These win over a matching Indian city name (e.g. "Hyderabad, Pakistan")
  not_india_terms: ['pakistan', 'sindh', 'bangladesh', 'sri lanka', 'nepal']
  remote_terms: ['remote', 'work from home', '\bwfh\b', 'anywhere', 'distributed']
  # Drop everything that isn't in India or remote-open-to-India.
  drop_ineligible: true

# Walk-in drives need you there in person, so they're kept only when the
# location includes Hyderabad. Regular jobs elsewhere in India are unaffected.
walk_in:
  patterns: ['walk[- ]?ins?\b', '\bwalkin', '(face[- ]to[- ]face|f2f|in[- ]person|weekend|hiring) (interview )?drive\b']
  allowed_locations: ['hyderabad', 'secunderabad', 'hitec city', 'gachibowli']
  # Online drives you can attend from anywhere
  virtual_terms: ['virtual', 'online', 'video (call|interview)', 'teams interview', 'zoom']

experience:
  points: 10
  # Your band: jobs asking for anything from 2 to 4 years. Parsed from the
  # description ("3+ years", "2-5 years", Naukri's "3-6 Yrs"):
  #   "5+ years", "6-8 years"  -> dropped (asks for more than max_years)
  #   "0-1 years"              -> dropped (tops out below min_years)
  #   "1-3", "3-6", "4-7"      -> kept: the range overlaps yours
  #   no years mentioned       -> kept, with unknown_points
  min_years: 2
  max_years: 4
  drop_outside_range: true
  unknown_points: 5

recency:                     # days since posted -> points (first match wins)
  - { max_days: 1,  points: 10 }
  - { max_days: 3,  points: 8 }
  - { max_days: 7,  points: 6 }
  - { max_days: 14, points: 3 }
  - { max_days: 30, points: 1 }

# ---------------------------------------------------------------------------
# Sources. Each runs in isolation: one failing never stops the others.
# Set enabled: false to switch one off. min_interval_hours throttles sources
# that ask for gentle use (state is kept in docs/jobs.json).
# ---------------------------------------------------------------------------
sources:
  greenhouse:      { enabled: true }
  lever:           { enabled: true }
  ashby:           { enabled: true }
  smartrecruiters: { enabled: true, query: data, max_details_per_company: 15 }
  jobspy:
    # LinkedIn, Naukri and Indeed India via the open-source JobSpy library
    # (github.com/speedyapply/JobSpy). It reads those sites' public search pages without
    # logging in, which their terms of use don't allow. Switched on by the app owner's
    # decision (Oct 2026) for this private group. Set both to false to stop it.
    enabled: true
    permitted: true
    # Job portals: only LinkedIn and Naukri (owner's choice, Oct 2026). Indeed, Glassdoor and Google Jobs
    # are off; companies' own careers sites (greenhouse, lever, ashby, smartrecruiters above) stay on.
    sites: [linkedin, naukri]
    queries: ['azure data engineer', 'databricks data engineer', 'data engineer pyspark']
    location: India
    country_indeed: india
    results_wanted: 50       # per site per query (more per role now that every user's roles share the searches)
    hours_old: 72            # only recent postings; runs every 3h so this has slack
    fetch_description: true  # needed for skill scoring; slower (one extra request per job)
  # Aggregator portals: off, only LinkedIn and Naukri are wanted (owner's choice, Oct 2026)
  adzuna:
    enabled: false           # needs ADZUNA_APP_ID + ADZUNA_APP_KEY, skipped otherwise
    country: in
    queries: ['azure data engineer', 'data engineer databricks']
    where: ['Hyderabad', 'Bangalore', 'Pune', 'Mumbai']
    results_per_page: 50
    # 2 queries x 4 cities = 8 calls/run, 64/day: well under the free quota
  jooble:
    enabled: false           # needs JOOBLE_API_KEY, skipped otherwise
    queries: ['azure data engineer', 'databricks data engineer']
    locations: ['Hyderabad', 'Bangalore', 'Pune', 'Mumbai', 'India']
    min_interval_hours: 6   # 10 calls/run x 4 runs/day, keeps the free key happy
  remotive:
    enabled: false
    category: data
    search: data engineer
    min_interval_hours: 6   # Remotive asks for at most ~4 calls/day
  arbeitnow:
    enabled: false           # mostly Europe; the India-only filter keeps any Indian / India-remote ones
    pages: 3
    remote_only: true

